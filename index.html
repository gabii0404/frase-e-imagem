<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frases e Reflexões</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <section class="card">
            <p class="frase">"O mundo está mudando. Em breve só existirão conquistados e conquistadores."</p>
            <div class="moldura-imagem">
                <span>4 x 4</span>
            </div>
        </section>

        <section class="card">
            <p class="frase">"Garçom tenho fome, sirva-me um Whisky."</p>
            <div class="moldura-imagem">
                <span>4 x 4</span>
            </div>
        </section>

        <section class="card">
            <p class="frase">"Se alguém precisa de ajuda e você pode ajudar, tem a obrigação de fazer isso."</p>
            <div class="moldura-imagem">
                <span>4 x 4</span>
            </div>
        </section>
    </main>

</body>
</html>
